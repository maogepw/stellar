name: Build and Release

on:
  push:
    tags:
      - 'v*' # 当推送形如 v1.0.0 的 tag 时触发

permissions:
  contents: write # 显式赋予 Release 创建与上传权限

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # 修复此处参数名

      # 打包项目（如果项目需要 npm 构建）
      - name: Build Project
        run: |
          npm ci
          npm run build || true

      # 将打包产物压缩成 release.tar.gz
      - name: Create archive
        run: |
          tar -czvf release.tar.gz -C dist . || tar -czvf release.tar.gz README.md

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: release.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
