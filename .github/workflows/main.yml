name: Build and Release

on:
  push:
    tags:
      - 'v*' # 推送形如 v1.1.0 的 tag 时触发发布
  workflow_dispatch: {} # 支持手动运行，只做构建校验不出 Release

permissions:
  contents: write # Release 创建与资产上传权限

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc # 与仓库内 .nvmrc 统一；Node 20 已于 2026-04-30 EOL
          check-latest: true # 始终取该 LTS 的最新补丁版（含安全修复）
          cache: npm

      - name: Show toolchain versions
        run: |
          node -v
          npm -v
          echo "engines 约束：$(node -e "console.log(require('./package.json').engines.node)")"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build Project
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -s dist/env.js
          [ "$(find dist -name '*.js' | wc -l)" -gt 0 ]
          echo "构建产物文件数：$(find dist -type f | wc -l)"

      - name: Create archives
        run: |
          tar -czf stellar-dist.tar.gz -C dist .
          (cd dist && zip -qr ../stellar-dist.zip .)
          ls -lh stellar-dist.tar.gz stellar-dist.zip

      - name: Upload dist artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: stellar-dist
          path: dist
          if-no-files-found: error

      - name: Create Release and Upload Assets
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v3
        with:
          files: |
            stellar-dist.tar.gz
            stellar-dist.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
